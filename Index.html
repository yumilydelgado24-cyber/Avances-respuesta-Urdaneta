<style>
/* Layout: encabezado, pestañas (Resumen + una por área), y en cada vista un anillo de avance, gráficas dinámicas y tarjetas de indicadores. */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --fg: #14262b;
  --muted: #5d7279;
  --line: #d9e2e5;
  --grid: #e6edef;
  --accent: #0e6b7a;
  --accent-soft: #dcedf0;
  --none: #8a9ca2;
  --low: #c98a0a;
  --mid: #1f8a5b;
  --done: #0e6b7a;
  --on-fill: #ffffff;
  --a1: #1c2f6b; --a2: #7e3fc2; --a3: #e3ad00; --a4: #f07818; --a5: #4cb8ec; --a6: #3a9a4a; /* Educación azul marino · Nutrición morado · Salud amarillo · Protección naranja · WASH azul claro */
  --p1: #c23a73; --p2: #2f7fd1; --p3: #6a4fc4; --p4: #d9622b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a1d; --surface: #162428; --fg: #e4eef0; --muted: #94aab1; --line: #2a3e44; --grid: #243639;
    --accent: #4fb6c6; --accent-soft: #1b3a41; --none: #6f858c; --low: #e0a93a; --mid: #43b883; --done: #4fb6c6; --on-fill: #0f1a1d;
    --a1: #7f9be8; --a2: #b68df2; --a3: #f2c230; --a4: #f59a4a; --a5: #7fd0f7; --a6: #5cc06b;
    --p1: #e46b9d; --p2: #6aa8ee; --p3: #9d86ea; --p4: #f0875a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a1d; --surface: #162428; --fg: #e4eef0; --muted: #94aab1; --line: #2a3e44; --grid: #243639;
  --accent: #4fb6c6; --accent-soft: #1b3a41; --none: #6f858c; --low: #e0a93a; --mid: #43b883; --done: #4fb6c6; --on-fill: #0f1a1d;
    --a1: #7f9be8; --a2: #b68df2; --a3: #f2c230; --a4: #f59a4a; --a5: #7fd0f7; --a6: #5cc06b;
    --p1: #e46b9d; --p2: #6aa8ee; --p3: #9d86ea; --p4: #f0875a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.sub { margin: 2px 0 10px; font-size: 13px; color: var(--muted); }

header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.title-wrap { min-width: 0; flex: 1 1 320px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
#project, input.sname {
  width: 100%; border: 0; border-bottom: 1px dashed transparent; background: transparent; padding: 2px 0;
  font-family: var(--font-display); font-weight: 700; line-height: 1.15; text-wrap: balance;
}
#project { font-size: clamp(24px, 4.6vw, 36px); }
input.sname { font-size: clamp(22px, 4vw, 30px); }
#project:hover, #project:focus, input.sname:hover, input.sname:focus { border-bottom-color: var(--line); outline: none; }
.cutoff { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.cutoff input { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-family: var(--font-mono); font-size: 13px; }

/* pestañas */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab {
  flex: none; max-width: 230px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; color: var(--muted); font-weight: 500;
}
.tab .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .tb { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tab:hover { color: var(--fg); border-color: var(--accent); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-fill); }
.tab[aria-selected="true"] .tb { color: var(--on-fill); }
.tab.add { border-style: dashed; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.cbox { position: relative; width: 100%; }
.sec { margin: 6px 0 12px; }

/* anillo */
.hero, .ahead { display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: center; }
.ringbox { position: relative; width: 170px; height: 170px; flex: none; }
.ringtxt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.ringtxt b { font-family: var(--font-mono); font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
.ringtxt small { font-size: 12px; color: var(--muted); }
.ainfo { flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

.tiles { flex: 1 1 360px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.tile .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 500; margin-top: 2px; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* tarjetas de áreas */
.acards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.acard { text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.acard:hover { border-color: var(--accent); }
.acard .an { font-weight: 600; overflow-wrap: anywhere; }
.acard .ap { font-family: var(--font-mono); font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }
.acard .as { font-size: 12px; color: var(--muted); }

.track { position: relative; height: 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; transition: width .25s ease; }
.st-none .fill, .st-none .pill, .st-nometa .fill, .st-nometa .pill { background: var(--none); }
.st-low .fill, .st-low .pill { background: var(--low); }
.st-mid .fill, .st-mid .pill { background: var(--mid); }
.st-done .fill, .st-done .pill { background: var(--done); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; color: var(--on-fill); white-space: nowrap; }

/* indicadores */
#inds { display: flex; flex-direction: column; gap: 12px; }
.ind { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ititle { font-weight: 500; overflow-wrap: anywhere; }
.irow { display: flex; align-items: center; gap: 12px; }
.irow .track { flex: 1; min-width: 0; }
.pct { font-family: var(--font-mono); font-size: 18px; font-weight: 500; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.grp { display: grid; grid-template-columns: 62px repeat(5, minmax(0, 1fr)); gap: 6px; align-items: center; font-size: 13px; }
.gh { font-size: 11px; color: var(--muted); text-align: right; letter-spacing: .03em; text-transform: uppercase; }
.gl { font-size: 12px; color: var(--muted); }
.gv { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; padding: 5px 6px; }
.gv.tot { font-weight: 500; }
.grp input { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font-family: var(--font-mono); font-size: 14px; text-align: right; }
.grp input.dim { opacity: .55; }
details summary { cursor: pointer; font-size: 13px; color: var(--accent); width: fit-content; }
.dbody { display: grid; gap: 10px; margin-top: 10px; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.dbody label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.dbody input[type="text"], .dbody textarea, .dbody input[type="number"] { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 14px; color: var(--fg); }
.dbody textarea { resize: vertical; min-height: 90px; line-height: 1.4; }
.metas { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.metas input { font-family: var(--font-mono); text-align: right; }

.btn { background: var(--accent); color: var(--on-fill); border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 500; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.danger[data-armed="1"] { background: #c4432f; color: #fff; border-color: #c4432f; }
.btn:hover { filter: brightness(1.08); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.toast { font-size: 13px; color: var(--mid); min-height: 18px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.tab[aria-selected="true"] .dot { box-shadow: 0 0 0 2px var(--on-fill); }
.ahead input.sname { color: var(--c); }
.ahead .ringtxt b { color: var(--c); }
.ainfo .tiles { flex: none; }
.mapbox { overflow-x: auto; }
.mapbox img { display: block; width: 100%; min-width: 560px; height: auto; border-radius: 6px; background: #fff; border: 1px solid var(--line); }
.asum { display: flex; flex-direction: column; gap: 4px; }
.asum label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.asum textarea { width: 100%; resize: vertical; min-height: 96px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 15px; line-height: 1.55; color: var(--fg); }
.acard .an { color: var(--fg); }
.acard .ap { color: var(--c); }
.acard .fill { background: var(--c); }
.acard .track { background: color-mix(in srgb, var(--c) 18%, var(--surface)); border-color: color-mix(in srgb, var(--c) 30%, var(--surface)); }
.acard .asm { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ind .fill { background: var(--ic); }
.ind .track { background: color-mix(in srgb, var(--ic) 18%, var(--surface)); border-color: color-mix(in srgb, var(--ic) 30%, var(--surface)); }
.ind .pct { color: var(--ic); }
#project { display: block; resize: none; overflow: hidden; }
.hright { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang .lb { background: transparent; border: 0; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.lang .lb:hover { color: var(--fg); }
.lang .lb[aria-pressed="true"] { background: var(--accent); color: var(--on-fill); }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

    mk("ringG", "doughnut", ringOpts(), ringData(function () { return avgPct(allInd().filter(function (i) { return pctOf(i) !== null; })); }));
    mk("cAreas", "bar", (function () {
      var o = hbarOpts(names, function (k) { var s = state.sectors[k]; var ms = measured(s); return countDone(ms) + " " + T("of") + " " + ms.length + " " + T("targetsMetLc"); });
      o.onClick = function (e, els) { if (els.length) go(state.sectors[els[0].index].id); };
      o.onHover = function (e, els) { e.native.target.style.cursor = els.length ? "pointer" : "default"; };
      return o;
    })(), function () {
      return { labels: state.sectors.map(function (s) { return wrap(tr(s, "name"), 24); }), datasets: [
        { data: state.sectors.map(function (s) { return avgPct(measured(s)) || 0; }), backgroundColor: state.sectors.map(acol), borderRadius: 4, barPercentage: .7, grouped: false, order: 1 },
        { data: state.sectors.map(function () { return 100; }), backgroundColor: state.sectors.map(function (s) { return tint(acol(s), .2); }), borderRadius: 4, barPercentage: .7, grouped: false, order: 2 }
      ] };
    });
    mk("cEstados", "doughnut", {
      responsive: true, maintainAspectRatio: false, cutout: "58%", animation: { duration: 500 },
      plugins: { legend: { position: "bottom", labels: { boxWidth: 12, boxHeight: 12 } }, tooltip: { callbacks: { label: function (c) { return c.label + ": " + c.raw + " " + T("indicators"); } } } }
    }, function () {
      var m = allInd().filter(function (i) { return pctOf(i) !== null; });
      return { labels: STATES.map(function (s) { return LABELS[s]; }), datasets: [{ data: STATES.map(function (s) { return m.filter(function (i) { return statusOf(i) === s; }).length; }), backgroundColor: STATES.map(stColor), borderColor: css("--surface"), borderWidth: 2 }] };
    });
    mk("cPob", "bar", groupOpts(), groupData(allInd));
  }

  /* ---------- vista: área ---------- */
  function areaTexts(s) {
    var ms = measured(s), p = avgPct(ms);
    $("ringAtxt").innerHTML = "<b>" + pctTxt(p) + "</b><small>" + T("areaProg") + "</small>";
    $("atiles").innerHTML =
      '<div class="tile"><div class="k">' + T("targetsMet") + '</div><div class="v">' + countDone(ms) + '</div><div class="s">' + T("of") + ' ' + ms.length + ' ' + T("indWithTarget") + '</div></div>' +
      '<div class="tile"><div class="k">' + T("achieved") + '</div><div class="v">' + fmt(sumAch(s.indicators)) + '</div><div class="s">' + T("of") + ' ' + fmt(sumMeta(s.indicators)) + ' ' + T("targetedWord") + '</div></div>' +
      '<div class="tile"><div class="k">' + T("remainingK") + '</div><div class="v">' + Math.max(0, ms.length - countDone(ms)) + '</div><div class="s">' + T("indPending") + '</div></div>';
  }

  function indHtml(i, k, s) {
    var p = pctOf(i), st = statusOf(i);
    var head = '<div class="gh"></div>' + GROUPS.map(function (g) { return '<div class="gh">' + g[1] + '</div>'; }).join("") + '<div class="gh">Total</div>';
    var meta = '<div class="gl">' + T("target") + '</div>' + GROUPS.map(function (g) { return '<div class="gv" data-m="' + g[0] + '">' + (num(i[g[0]]) ? fmt(num(i[g[0]])) : "–") + '</div>'; }).join("") + '<div class="gv tot" data-mt>' + fmt(metaOf(i)) + '</div>';
    var ach = '<div class="gl">' + T("achieved") + '</div>' + GROUPS.map(function (g) {
      return '<input type="number" min="0" data-a="' + g[0] + '" value="' + num(i.ach[g[0]]) + '" aria-label="' + T("achieved") + ' ' + g[1] + '"' + (num(i[g[0]]) ? "" : ' class="dim"') + '>';
    }).join("") + '<div class="gv tot" data-at>' + fmt(achOf(i)) + '</div>';
    var gi = GROUPS.map(function (g) { return '<label>' + T("target") + ' ' + g[1] + '<input type="number" min="0" data-f="' + g[0] + '" value="' + num(i[g[0]]) + '"></label>'; }).join("");
    return '<article class="ind st-' + st + '" style="--ic:var(--a' + ((s.ci % 6) + 1) + ')" data-iid="' + i.id + '">' +
      '<div class="ititle">' + esc(tr(i, "name") || T("unnamedInd")) + '</div>' +
      '<div class="irow"><div class="track"><div class="fill" style="width:' + Math.min(100, p || 0) + '%"></div></div><span class="pct">' + pctTxt(p) + '</span><span class="pill">' + LABELS[st] + '</span></div>' +
      '<div class="grp">' + head + meta + ach + '</div>' +
      '<details><summary>' + T("actAdj") + '</summary><div class="dbody">' +
      '<label>' + T("indicator") + '<input type="text" data-f="name" value="' + esc(tr(i, "name")) + '"></label>' +
      '<label>' + T("activity") + '<textarea data-f="activity">' + esc(tr(i, "activity")) + '</textarea></label>' +
      '<div class="metas">' + gi + '</div>' +
      '<div><button class="btn ghost danger sm" type="button" data-act="delInd">' + T("removeInd") + '</button></div></div></details></article>';
  }

  function renderArea(s) {
    var n = Math.max(1, s.indicators.length), h = Math.max(280, 80 + n * 66);
    $("view").innerHTML =
      '<section class="panel ahead" style="--c:var(--a' + ((s.ci % 6) + 1) + ')"><div class="ringbox"><canvas id="ringA"></canvas><div class="ringtxt" id="ringAtxt"></div></div>' +
      '<div class="ainfo"><input class="sname" type="text" id="sname" aria-label="' + T("areaName") + '" value="' + esc(tr(s, "name")) + '"><div class="asum"><label for="asum">' + T("areaSummary") + '</label><textarea id="asum" rows="4" placeholder="' + T("areaSumPh") + '">' + esc(tr(s, "summary")) + '</textarea></div><div class="tiles" id="atiles"></div></div></section>' +
      '<div class="grid2"><section class="panel"><h2>' + T("progByInd") + '</h2><p class="sub">' + T("progByIndSub") + '</p><div class="cbox" style="height:' + h + 'px"><canvas id="cInd"></canvas></div></section>' +
      '<section class="panel"><h2>' + T("tgtAchPop") + '</h2><p class="sub">' + T("popSubArea") + '</p><div class="cbox" style="height:' + h + 'px"><canvas id="cPobA"></canvas></div></section></div>' +
      '<section><h2 class="sec">' + T("indToMeasure") + '</h2><div id="inds">' + s.indicators.map(function (i, k) { return indHtml(i, k, s); }).join("") + '</div>' +
      '<div class="actions"><button class="btn" type="button" data-act="addInd">' + T("addInd") + '</button><button class="btn ghost danger" type="button" data-act="delSector">' + T("removeArea") + '</button></div></section>';
    areaTexts(s);
    autosize($("asum"));
    themeDefaults();
    mk("ringA", "doughnut", ringOpts(), ringData(function () { return avgPct(measured(s)); }, function () { return acol(s); }));
    mk("cInd", "bar", hbarOpts(function () { return s.indicators.map(function (i) { return String(tr(i, "name") || "").replace(/^#\s*/, ""); }); }, function (k) {
      var i = s.indicators[k]; return fmt(achOf(i)) + " " + T("of") + " " + fmt(metaOf(i));
    }), function () {
      return { labels: s.indicators.map(function (i) { return wrap(tr(i, "name"), 34); }), datasets: [
        { data: s.indicators.map(function (i) { return pctOf(i) || 0; }), backgroundColor: s.indicators.map(function () { return acol(s); }), borderRadius: 4, barPercentage: .65, grouped: false, order: 1 },
        { data: s.indicators.map(function () { return 100; }), backgroundColor: s.indicators.map(function () { return tint(acol(s), .2); }), borderRadius: 4, barPercentage: .65, grouped: false, order: 2 }
      ] };
    });
    mk("cPobA", "bar", groupOpts(), groupData(function () { return s.indicators; }));
  }

  function renderView() {
    destroyCharts();
    var s = findSector(view);
    if (s) renderArea(s); else renderSummary();
    if (typeof Chart === "undefined") $("view").insertAdjacentHTML("afterbegin", '<p class="note">' + T("chartsFail") + '</p>');
  }

  function refreshInd(id) {
    var f = findInd(id); if (!f) return;
    var el = document.querySelector('[data-iid="' + id + '"]'); if (!el) return;
    var i = f.i, p = pctOf(i), st = statusOf(i);
    el.className = "ind st-" + st;
    el.querySelector(".ititle").textContent = tr(i, "name") || T("unnamedInd");
    el.querySelector(".fill").style.width = Math.min(100, p || 0) + "%";
    el.querySelector(".pct").textContent = pctTxt(p);
    el.querySelector(".pill").textContent = LABELS[st];
    el.querySelector("[data-mt]").textContent = fmt(metaOf(i));
    el.querySelector("[data-at]").textContent = fmt(achOf(i));
    GROUPS.forEach(function (g) {
      el.querySelector('[data-m="' + g[0] + '"]').textContent = num(i[g[0]]) ? fmt(num(i[g[0]])) : "–";
      var inp = el.querySelector('[data-a="' + g[0] + '"]'); if (inp) inp.classList.toggle("dim", !num(i[g[0]]));
    });
    areaTexts(f.s); updateBadges(); refreshCharts(); save();
  }

  function toast(msg) { var t = $("toast"); if (!t) return; t.textContent = msg; setTimeout(function () { if (t.textContent === msg) t.textContent = ""; }, 2500); }
  function arm(btn, label, run) {
    if (btn.getAttribute("data-armed") === "1") { run(); return; }
    var orig = btn.textContent;
    btn.setAttribute("data-armed", "1"); btn.textContent = label;
    setTimeout(function () { if (btn.isConnected) { btn.removeAttribute("data-armed"); btn.textContent = orig; } }, 3000);
  }

  /* ---------- eventos ---------- */
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.add) {
      var ns = { id: uid(), name: TX.es.newArea, name_en: TX.en.newArea, summary: "", summary_en: "", ci: state.sectors.reduce(function (m, x) { return Math.max(m, x.ci); }, -1) + 1, indicators: [newInd()] };
      state.sectors.push(ns); save(); renderTabs(); go(ns.id);
    } else if (b.dataset.tab) go(b.dataset.tab);
  });
  $("view").addEventListener("click", function (e) {
    var o = e.target.closest("[data-open]"); if (o) { go(o.dataset.open); return; }
    var b = e.target.closest("[data-act]");
    if (b) {
      var s = findSector(view); if (!s) return;
      var act = b.dataset.act;
      if (act === "addInd") {
        s.indicators.push(newInd()); save(); renderView();
        var last = document.querySelector("#inds .ind:last-child details"); if (last) { last.open = true; var nm = last.querySelector('[data-f="name"]'); if (nm) { nm.scrollIntoView({ block: "center" }); nm.focus(); nm.select(); } }
      } else if (act === "delInd") {
        var iid = b.closest(".ind").dataset.iid;
        arm(b, T("confRemove"), function () { s.indicators = s.indicators.filter(function (x) { return x.id !== iid; }); save(); updateBadges(); renderView(); });
      } else if (act === "delSector") {
        arm(b, T("confRemoveArea"), function () { state.sectors = state.sectors.filter(function (x) { return x.id !== s.id; }); save(); renderTabs(); go("resumen"); });
      }
      return;
    }
    if (e.target.id === "reset") {
      arm(e.target, T("confReset"), function () {
        state = seed(); state.baseRev = BASE_REV; normalize(); applyStatic(); save(); renderTabs(); go("resumen"); route();
      });
    }
    if (e.target.id === "copy") copySummary();
    if (e.target.id === "copyData") copyData();
    if (e.target.id === "dlData") downloadWithData();
    if (e.target.id === "loadData") { var lb = $("loadbox"); lb.hidden = !lb.hidden; if (!lb.hidden) $("jsonin").focus(); }
    if (e.target.id === "cancelData") $("loadbox").hidden = true;
    if (e.target.id === "applyData") applyData();
  });
  $("view").addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "sname") {
      var s = findSector(view); if (!s) return;
      setTr(s, "name", t.value); var tn = $("tabs").querySelector('[data-tab="' + s.id + '"]'); if (tn) { tn.title = tr(s, "name"); tn.querySelector(".tn").textContent = tr(s, "name") || T("unnamed"); }
      save(); return;
    }
    if (t.id === "asum") { var s2 = findSector(view); if (s2) { setTr(s2, "summary", t.value); autosize(t); save(); } return; }
    var row = t.closest(".ind"); if (!row) return;
    var hit = findInd(row.dataset.iid); if (!hit) return;
    if (t.dataset.a) hit.i.ach[t.dataset.a] = num(t.value);
    else if (t.dataset.f === "name" || t.dataset.f === "activity") setTr(hit.i, t.dataset.f, t.value);
    else if (t.dataset.f) hit.i[t.dataset.f] = num(t.value);
    else return;
    refreshInd(hit.i.id);
  });
  $("project").addEventListener("input", function (e) { setTr(state, "project", e.target.value); fitTitle(); save(); });
  $("project").addEventListener("keydown", function (e) { if (e.key === "Enter") e.preventDefault(); });
  window.addEventListener("resize", fitTitle);
  $("cutoff").addEventListener("input", function (e) { state.cutoff = e.target.value; save(); });

  function downloadWithData() {
    try {
      var snap = JSON.parse(JSON.stringify(state)); snap.baseRev = (BASE_REV || 0) + 1;
      var root = document.documentElement.cloneNode(true);
      ["tabs", "view", "note", "eyebrow", "cutlbl"].forEach(function (id) { var n = root.querySelector("#" + id); if (n) n.textContent = ""; });
      var pj = root.querySelector("#project"); if (pj) pj.textContent = "";
      root.querySelectorAll("script:not([src])").forEach(function (sc) {
        var t = sc.textContent, a = "var BASE_REV = 0, BASE_STATE = null;";
        if (t.indexOf(a) > -1) sc.textContent = t.replace(a, function () { return "var BASE_REV = " + snap.baseRev + ", BASE_STATE = " + JSON.stringify(snap).replace(/</g, "\\u003c") + ";"; });
      });
      var html = "<!doctype html>\n" + root.outerHTML;
      var blob = new Blob([html], { type: "text/html;charset=utf-8" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Avance_Parroquia_Urdaneta_con_avances.html";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast(T("toastDl"));
    } catch (err) { toast(T("toastNoCopy")); }
  }
  function copyData() {
    var text = JSON.stringify({ app: "avance-areas", v: 3, project: state.project, project_en: state.project_en, cutoff: state.cutoff, sectors: state.sectors });
    var ok = function () { toast(T("toastCopied")); };
    var fb = function () {
      var lb = $("loadbox"), ta = $("jsonin"); lb.hidden = false; ta.value = text; ta.focus(); ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) { toast(T("toastSelect")); }
    };
    try { navigator.clipboard.writeText(text).then(ok, fb); } catch (e) { fb(); }
  }
  function applyData() {
    var d;
    try { d = JSON.parse($("jsonin").value.trim()); } catch (e) { toast(T("toastInvalid")); return; }
    if (!d || !Array.isArray(d.sectors) || !d.sectors.every(function (x) { return x && Array.isArray(x.indicators); })) { toast(T("toastMissing")); return; }
    state = { project: d.project || state.project, project_en: d.project_en, cutoff: d.cutoff || state.cutoff, sectors: d.sectors, baseRev: BASE_REV };
    state.sectors.forEach(function (x) { if (!x.id) x.id = uid(); x.indicators.forEach(function (i) { if (!i.id) i.id = uid(); }); });
    normalize(); save();
    applyStatic();
    renderTabs(); go("resumen");
    setTimeout(function () { toast(T("toastLoaded")); }, 150);
  }
  function copySummary() {
    var lines = [tr(state, "project") + " (" + T("cutoffWord") + " " + state.cutoff + ")"];
    state.sectors.forEach(function (s) {
      lines.push("", tr(s, "name") + ": " + pctTxt(avgPct(measured(s))));
      if (tr(s, "summary")) lines.push(tr(s, "summary"));
      s.indicators.forEach(function (i) {
        var q = pctOf(i);
        lines.push("- " + String(tr(i, "name")).replace(/^#\s*/, "") + ": " + fmt(achOf(i)) + " " + T("of") + " " + fmt(metaOf(i)) + (q === null ? "" : " (" + q + "%)"));
      });
    });
    var text = lines.join("\n");
    var ok = function () { toast(T("toastSummary")); };
    var fb = function () { var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch (e) { toast(T("toastNoCopy")); } ta.remove(); };
    try { navigator.clipboard.writeText(text).then(ok, fb); } catch (e) { fb(); }
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest(".lb"); if (!b) return;
    LANG = b.dataset.lang;
    try { localStorage.setItem("avance-lang", LANG); } catch (x) {}
    applyStatic(); renderTabs(); route();
  });
  window.addEventListener("hashchange", route);
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderView); } catch (e) {}
  try { new MutationObserver(renderView).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); } catch (e) {}

  applyStatic();
  renderTabs();
  route();
})();
</script>
</body></html>
